<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AgentCFO README Preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-dark.min.css"
    />
    <link rel="stylesheet" href="./preview-readme.css" />
  </head>
  <body data-color-mode="dark" data-dark-theme="dark">
    <header class="preview-toolbar">
      <div>
        <strong>AgentCFO README Preview</strong>
        <span id="preview-status" role="status">准备加载</span>
      </div>
      <button id="preview-reload" type="button">重新加载</button>
    </header>

    <main id="preview-content" class="markdown-body" aria-live="polite"></main>

    <footer class="preview-footer">
      本地预览，不会修改 README.md。
    </footer>

    <script>
      window.__PREVIEW_README__ = {
        language: "zh-CN",
        title: "AgentCFO README Preview",
        readmePath: "./README.md",
        expectedPort: 4173,
        fileProtocolMessage:
          "请在仓库根运行 python -m http.server 4173，然后打开 http://127.0.0.1:4173/preview-readme.html",
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="./preview-readme.js"></script>
  </body>
</html>
